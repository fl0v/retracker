version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - copyloopvar
    - errname
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
  disable:
    - cyclop
    - errcheck
    - funlen
    - gocognit
    - gosec
  settings:
    govet:
      enable-all: true
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - goconst
          - gosec
        path: _test\.go
      - path: (.+)\.go$
        text: Error return value of .* is not checked
      - path: (.+)\.go$
        text: exported function .* should have comment
      - path: (.+)\.go$
        text: comment on exported .* should be of the form
      # Preserve the existing exclusion for field alignment suggestions.
      - path: (.+)\.go$
        text: 'fieldalignment:'
    paths:
      - .*\.pb\.go$
      - .*_generated\.go$
      - bin
      - vendor
      - .git
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fl0v/retracker
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*_generated\.go$
      - bin
      - vendor
      - .git
      - third_party$
      - builtin$
      - examples$
